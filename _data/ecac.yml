source_title: Europski kodeks protiv raka, peto izdanje 14 načina za prevenciju raka
items:
- title: Pušenje
  paragraphs:
  - Nemojte pušiti. Nemojte konzumirati nikakav oblik duvana ni proizvode za e-pušenje. Ako pušite, trebali biste prestati.
- title: Izlaganje tuđem duvanskom dimu
  paragraphs:
  - Izbjegavajte duvanski dim u svom domu i automobilu.
- title: Prekomerna telesna težina i gojaznost
  paragraphs:
  - 'Poduzmite korake za izbjegavanje ili regulaciju prekomerne težine i gojaznosti: ·     ograničite unos hrane s previše kalorija, šećera, masti i soli'
  - ·     ograničite unos pića s previše šećera; pijte uglavnom vodu i nezaslađena pića ·     ograničite unos ultra-prerađene hrane.
- title: Fizička aktivnost
  paragraphs:
  - Budite fizički aktivni u svakodnevnom životu. Ograničite vrijeme koje provodite sjedeći.
- title: Ishrana
  paragraphs:
  - Neka integralne žitarice, povrće, mahunarke i voće čine osnovu vaše svakodnevne ishrane. Ograničite unos crvenog mesa i potpuno izbegavajte mesne prerađevine.
- title: Alkohol
  paragraphs:
  - Izbjegavajte alkoholna pića.
- title: Dojenje
  paragraphs:
  - Dojite novorođenče što duže možete.
- title: Izlaganje suncu
  paragraphs:
  - Izbegavajte prekomerno izlaganje suncu, a posebno zaštitite decu. Koristite zaštitnu odeću i sredstva sa zaštitnim faktorom. Potpuno izbegavajte korišćenje solarijuma.
- title: Kancerogeni faktori na radnom mjestu
  paragraphs:
  - Informišite se o kancerogenim materijama kojima možete biti izloženi na poslu. Pozovite poslodavca da sprovede sve propisane mere zaštite i uvek se strogo pridržavajte zdravstvenih i bezbednosnih uputstava.
- title: Radon u zatvorenim prostorima
  paragraphs:
  - Saznajte da li ste izloženi povišenom nivou prirodnog zračenja radona u svom domu proverom lokalnih mapa. Angažujte stručnjake za merenje nivoa radona i, ukoliko je potrebno, sprovedite mere za njegovo smanjenje
- title: Zagađenje vazduha
  paragraphs:
  - 'Poduzmite korake kako biste smanjili izloženost zagađenju vazduhaa:'
  - ·     umjesto automobilom putujte javnim prievozom, pešice ili biciklom ·     pešačite, vozite bicikl i vežbajte po manje prometnim rutama
  - ·    izbegnite korišćenje  čvrstih i fosilnih goriva (ugalj, drva) kako biste izbjegli izlaganje dimu kod kuće ·     zalažite se za politike za bolji kvalitet vazduha.
- title: Infekcije koje uzrokuju rak
  paragraphs:
  - ·     Vakcinišite decu (devojčice i dečake) protiv hepatitisa B (HBV) i humanog papiloma virusa (HPV) u prioritetnom uzrastu između  9 i 14 godina , u skladu sa nacionalnim preporukama.
  - ·     Učestvujte u programima testiranja i lečenja za hepatitis B i C (HBV, HCV), HIV (sida) i bakteriju  Helicobacter pylori.
- title: Hormonska supstituciona terapija (HST)
  paragraphs:
  - Ukoliko razmatrate HST za ublažavanje simptoma menopauze, učinite to tek nakon detaljnog razgovora sa lekarom. Ograničite upotrebu terapije na najkraći mogući period.
- title: Organizovani programi skrininga
  paragraphs:
  - 'Redovno učestvujte u organizovanim programima ranog otkrivanja u skladu s preporukama u vašoj zemlji za: ·     rak kolona i rektuma'
  - ·     rak dojke
  - ·     rak grlića maternice.
