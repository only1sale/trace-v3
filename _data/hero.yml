title: Prevencija počinje znanjem. Rano otkrivanje počinje delovanjem. Brinite o svom zdravlju.
text: Ova platforma znanja teži da prikupi informacije, znanja i inicijative o prevenciji raka povezivanjem univerziteta, istraživača, zdravstvenih ustanova, građana i drugih važnih aktera u regionu, kako bi se razvijala zajednička, efikasna i inovativna rešenja za prevenciju raka prilagođena potrebama stanovništva u Republici Srbiji i regionu.
